[project]
name = "analytics-project"
version = "0.1.0"
description = "Proyecto del semestre de Analitica de Datos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pandera>=0.32.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# Los tests siguen la convencion sklearn (X, X_train en mayuscula) y no
# requieren docstring por funcion.
"tests/*" = ["D100", "D103", "N803", "N806"]
# Firma definida por el enunciado del Lab 04 (convencion sklearn: X_train).
"src/analytics/train.py" = ["N803"]

[tool.ruff.lint.pydocstyle]
convention = "google"
